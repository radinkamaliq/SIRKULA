<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — SIRKULA</title>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="brand" style="justify-content:center;margin-bottom:1.5rem">
      <span class="brand-mark">S</span> <strong>SIRKULA</strong>
    </div>
    <h2 style="text-align:center">Welcome back</h2>
    <p style="color:var(--color-muted);margin-bottom:1.5rem;text-align:center">Sign in to your account to continue.</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label>Email / Username</label>
        <input type="text" name="email" placeholder="you@example.com" required>
        <div class="error-text" id="emailErr"></div>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
        <div class="error-text" id="passErr"></div>
      </div>
      <div class="field">
        <label>Role</label>
        <select name="role" required style="width:100%;padding:0.6rem 0.75rem;border:1px solid var(--color-border);border-radius:var(--radius-sm);font-size:0.95rem;background:var(--color-white);color:var(--color-charcoal)">
          <option value="">— Select role —</option>
          <option value="SELLER">Seller</option>
          <option value="RECEIVER">Receiver</option>
          <option value="ADMIN">Admin</option>
        </select>
        <div class="error-text" id="roleErr"></div>
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Sign In</button>
    </form>
    <div id="formMsg" style="margin-top:1rem"></div>
    <p style="margin-top:1.25rem;font-size:0.8rem;color:var(--color-muted);text-align:center;font-style:italic">
      Demo Access — No Registration Required
    </p>
    <div style="margin-top:1.25rem;padding:1rem;background:var(--color-warning-bg);border:1px solid var(--color-warning);border-radius:var(--radius-sm);font-size:0.85rem">
      <strong>Demo mode (no database):</strong><br>
      Enter any email/username and password, then select a role:<br>
      • <code>Seller</code> — manage inventory &amp; listings<br>
      • <code>Receiver</code> — browse &amp; reserve food<br>
      • <code>Admin</code> — platform oversight
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/storage.js"></script>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
