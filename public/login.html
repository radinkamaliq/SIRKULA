<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — SIRKULA</title>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="brand" style="justify-content:center;margin-bottom:1.5rem"><span class="brand-mark">S</span> <strong>SIRKULA</strong></div>
    <h2>Welcome back</h2>
    <p style="color:var(--color-muted);margin-bottom:1.5rem">Sign in to your account to continue.</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label>Email address</label>
        <input type="email" name="email" placeholder="you@example.com" required>
        <div class="error-text" id="emailErr"></div>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
        <div class="error-text" id="passErr"></div>
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Log in</button>
    </form>
    <p style="margin-top:1.25rem;font-size:0.9rem;color:var(--color-muted);text-align:center">
      Don't have an account? <a href="/register.html">Join SIRKULA</a>
    </p>
    <div id="formMsg" style="margin-top:1rem"></div>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
