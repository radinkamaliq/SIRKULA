<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join SIRKULA — Register</title>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="brand" style="justify-content:center;margin-bottom:1.5rem"><span class="brand-mark">S</span> <strong>SIRKULA</strong></div>
    <h2>Create an account</h2>
    <p style="color:var(--color-muted);margin-bottom:1.5rem">Create a local demo profile to explore SIRKULA.</p>
    <form id="registerForm" novalidate>
      <div class="field">
        <label>Full name</label>
        <input type="text" name="name" placeholder="Your name" required>
        <div class="error-text" id="nameErr"></div>
      </div>
      <div class="field">
        <label>Email address</label>
        <input type="email" name="email" placeholder="you@example.com" required>
        <div class="error-text" id="emailErr"></div>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
        <div class="helper">For this demo, enter any password you like. It is not saved or verified.</div>
        <div class="error-text" id="passErr"></div>
      </div>
      <div class="field">
        <label>I want to join as</label>
        <select name="role" required>
          <option value="">Select a role</option>
          <option value="SELLER">Seller (list surplus food)</option>
          <option value="RECEIVER">Receiver (request food)</option>
        </select>
        <div class="helper">Admin access is available from the demo Login page.</div>
        <div class="error-text" id="roleErr"></div>
      </div>
      <button type="submit" id="registerBtn" class="btn btn-primary btn-block">Create account</button>
    </form>
    <p style="margin-top:1.25rem;font-size:0.9rem;color:var(--color-muted);text-align:center">
      Already have an account? <a href="/login.html">Log in</a>
    </p>
    <div id="formMsg" class="form-message" role="status" aria-live="polite"></div>
    <p class="demo-note">Demo only • Profile data is stored in this browser.</p>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/storage.js"></script>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
